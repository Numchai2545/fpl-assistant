name: Save reviewed plan
description: Save one dashboard scenario as the plan to keep across refreshes and devices.
title: "[select-plan] GW0 scenario 0"
body:
  - type: markdown
    attributes:
      value: |
        เปิดจากปุ่ม “บันทึกแผนนี้” ในรายงานล่าสุด แล้วกด **Submit new issue**
        คงหัวข้อที่ระบบกรอกไว้ทั้งหมด รวมรหัสท้ายหัวข้อที่ใช้ยืนยันแผน
        หากรายงานเปลี่ยนระหว่างรอ ระบบจะไม่บันทึก กรุณาเปิดรายงานล่าสุดและเลือกอีกครั้ง
        การเลือกนี้บันทึกเฉพาะแผนในรายงาน ไม่ทำรายการในบัญชี FPL
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: บันทึก scenario นี้เป็นแผนที่เลือก
          required: true
