name: Deploy FPL Assistant to Pages

on:
  push:
    branches: [master]
  schedule:
    # 09:15 and 21:15 in Bangkok. The mobile app is never over 12 hours stale.
    - cron: "15 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Verify model and rules
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -q

      - name: Build current dashboard
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
          FPL_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python -m fplbot -v build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
