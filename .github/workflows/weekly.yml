name: Check FPL assistant manually

# The product is intentionally user-driven. This workflow is only a manual
# verification option; it never changes the FPL team or publishes a report.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      # The model is only as good as its arithmetic, and a wrong constant is
      # silent. Never publish a dashboard from a tree whose tests fail.
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -q

      - name: Build dashboard
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
        run: python -m fplbot -v build
