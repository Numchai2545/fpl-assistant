# ---------------------------------------------------------------------------
# FPL Assistant — configuration
# Everything the model needs to know about YOU lives here.
# ---------------------------------------------------------------------------

entry:
  team_id: 6014213          # Gnum United  (fantasy.premierleague.com/entry/6014213/)
  manager: "G Num"

planning:
  horizon: 6                # how many gameweeks ahead the optimiser plans
  decay: 0.86               # weight of GW n+1 relative to GW n (near term matters more)
  max_hit_per_gw: 8         # max points you are willing to pay in one GW (2 hits)
  max_total_hits: 12        # max across the whole horizon
  candidate_pool: 200       # players considered by the optimiser (top-N by EP + your squad)
  solver_time_limit: 180    # seconds; CBC stops and returns best found after this
  scenario_time_budget: 150 # seconds shared by all scenario solves, not per scenario
  build_time_budget: 300    # seconds; local web server enforces this total process budget
  output_time_reserve: 10   # seconds reserved after solving for rendering and saved outputs
  stale_after_hours: 24     # core source age that requires a visible stale-report warning
  fallback_budget: 100.0    # used only when your squad cannot be read (GW1, private entry)

  # Future weeks stay conservative, while this week's scenario comparison can
  # use every free transfer currently available.
  max_transfers_per_gw: 1
  scenario_max_transfers: 5
  scenario_alternatives: 2 # distinct complete plans for each transfer count

  # Judge a purchase over the player's next five actual fixtures, rather than
  # only the next gameweek. Blank and double gameweeks remain visible.
  outlook_matches: 5
  candidate_count: 4        # alternatives shown for the selected weak link
  priority_count: 5         # ranked upgrade rows; manager decides how many to act on
  comparison_count: 8       # top affordable peers shown when you click a player
  min_candidate_start: 0.50 # hide likely non-starters from replacement rankings
  min_transfer_gain: 3.0    # minimum five-match EP improvement to recommend a move
  hit_policy: emergency_only # a -4 is allowed only for an uncovered unavailable starter

  # How many expected points a transfer must gain before it is worth making.
  # A free transfer is not free: spending it now means not having it later, and
  # every move carries injury and price risk the model cannot see. At 0 the
  # solver churns the bench every week for hundredths of a point.
  #   0.4  loose   - moves often
  #   0.8  balanced - the default
  #   1.5  strict  - only clear upgrades, fewest transfers
  transfer_friction: 0.8

  # Keep the live API workload bounded. Full match histories are fetched only
  # for the current squad plus this many plausible transfer targets.
  minutes_shortlist: 30

strategy:
  # Ownership is display-only in every mode; legacy mode/weight keys are ignored.
  mode: balanced
  differential_weight: 0.0  # retained for older configs; never alters canonical EP
  # [reserve GK, then the three outfield subs]. The keeper only plays if your
  # starter does not, so his points are worth almost nothing; the outfield three
  # are explicit ordered slots. model.auto_sub_slot_probability takes precedence.
  bench_weight: [0.00, 0.16, 0.10, 0.05]
  captain_multiplier: 2.0

  # Players the optimiser is never allowed to sell — FPL element ids.
  # Use it for players you keep for reasons the model cannot see.
  never_sell: []

model:
  cameo_minutes: 14.0       # minutes conditional on a substitute cameo in the DC mixture
  prior_minutes: 360        # shrinkage strength: rates are trusted fully after ~4 full matches
  recent_form_weight: 0.15  # small FPL recent-form signal; fixtures and underlying stats stay primary
  xg_weight: 0.70           # xG vs actual goals in the blended scoring rate
  xa_weight: 0.75           # xA vs actual assists
  home_attack_mult: 1.10
  away_attack_mult: 0.92
  league_goals_per_team: 1.42   # baseline goals a team scores per match
  penalty_taker_mult: 1.08      # uplift for the #1 penalty taker
  set_piece_mult: 1.06          # uplift for the #1 corner/free-kick taker (assists only)
  opponent_clip: [0.60, 1.60]   # min/max opponent adjustment multiplier

  # Recent match histories improve the weakest part of v0.1: expected minutes.
  # The season estimate remains the fallback and supplies the prior when the
  # recent sample is small or element-summary cannot be fetched.
  recent_minutes_matches: 6
  recent_minutes_half_life: 3.0
  recent_minutes_prior_matches: 3.0

  # Bench slots are valued as the chance their points rescue a missing starter.
  # These probabilities are deliberately conservative until backtesting can
  # calibrate them; the outfield values also determine the displayed order.
  auto_sub_slot_probability: [0.06, 0.20, 0.11, 0.05]

  # Price pressure is an alert, never part of the EP ranking.
  price_rise_pressure: 0.45
  price_fall_pressure: -0.45

backtest:
  # Projections are frozen before the deadline. Later backtests fetch outcomes
  # only for these evaluated players, never element-summary for the full league.
  max_players_per_gameweek: 30

chips:
  # Mark chips as used once you play them. First set expires after GW19.
  wildcard_1: false
  wildcard_2: false
  free_hit_1: false
  free_hit_2: false
  triple_captain_1: false
  triple_captain_2: false
  bench_boost_1: false
  bench_boost_2: false

notify:
  # The calendar reminds you to double-click run_weekly.bat and review the data.
  remind_hours_before: [24]
  timezone: "Asia/Bangkok"
  # Free mobile refresh: GitHub verifies the signed-in issue author, then the
  # workflow fetches FPL with --fresh and republishes Pages. No token is in PWA.
  refresh_request_url: "https://github.com/Numchai2545/fpl-assistant/issues/new?template=refresh.yml&title=%5Brefresh%5D+Update+FPL+report"
  plan_request_url: "https://github.com/Numchai2545/fpl-assistant/issues/new?template=plan.yml"

output:
  site_dir: "docs"              # generated local dashboard and calendar
  data_dir: "data"              # raw API snapshots, one folder per run
  title: "Gnum United — FPL Assistant"
