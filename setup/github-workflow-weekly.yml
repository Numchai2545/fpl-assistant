name: Build FPL dashboard

# Runs in GitHub's cloud, so the dashboard is fresh whether or not your PC is on.
# Three times a day is enough: the notifier itself decides when the alert is due,
# and prices change once a day at 01:30 UK time.
on:
  schedule:
    - cron: "30 2 * * *"    # 09:30 Bangkok — after the overnight price changes
    - cron: "0 10 * * *"    # 17:00 Bangkok
    - cron: "0 16 * * 4,5"  # 23:00 Bangkok Thu/Fri — the usual 24h-before window
  workflow_dispatch:         # and a "Run workflow" button for whenever you want

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fpl-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build dashboard
        env:
          PYTHONPATH: src
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
        run: python -m fplbot build -v

      - name: Send deadline alert
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m fplbot notify
        continue-on-error: true

      - name: Commit the refreshed dashboard
        run: |
          git config user.name  "fpl-assistant"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "dashboard: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
